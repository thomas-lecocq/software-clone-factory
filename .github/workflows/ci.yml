# Replays every recorded fixture against the clone on each push and pull request. No target
# account is needed: the fixtures are the target's recorded behaviour. The run passes only when
# the checks are clean and exactly the declared divergences fail.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # The report checks that each analysis plan was committed before its batch.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - name: Replay every fixture
        run: >-
          npx tsx harness/src/cli.ts verify stripe-billing --split all
          --expected targets/stripe-billing/expected-failures.json
      - name: Keep the fidelity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fidelity-report
          path: targets/stripe-billing/verify/fidelity-report.md
